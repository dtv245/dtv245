name: Activity charts

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate activity charts
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/activity_chart.py --user dtv245 --out assets
      - name: Commit updated charts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub activity charts"
          file_pattern: "assets/*.svg"
